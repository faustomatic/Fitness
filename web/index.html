<title>FitCoach</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161A">
<style>
:root{
  --bg:#F5F4F2; --surface:#FFFFFF; --surface-2:#ECEBE7; --line:#DEDCD6;
  --ink:#191B1F; --ink-2:#5C5E64; --ink-3:#8A8C91;
  --accent:#E8412A; --accent-ink:#FFFFFF; --accent-soft:#FBE4DF;
  --good:#1F9E5A; --good-soft:#DDF1E6;
  --warn:#C9852A; --warn-soft:#F6E9D4;
  --bad:#C4362B;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(20,22,26,.06), 0 6px 20px rgba(20,22,26,.05);
  --tab-h:64px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101216; --surface:#191C22; --surface-2:#22262E; --line:#2C313A;
    --ink:#ECEDF0; --ink-2:#A5A8B0; --ink-3:#6F747E;
    --accent:#FF5436; --accent-ink:#0B0C0E; --accent-soft:#361c17;
    --good:#3FCB7E; --good-soft:#153726;
    --warn:#E0A34A; --warn-soft:#3a2d16;
    --bad:#F06A5C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#191C22; --surface-2:#22262E; --line:#2C313A;
  --ink:#ECEDF0; --ink-2:#A5A8B0; --ink-3:#6F747E;
  --accent:#FF5436; --accent-ink:#0B0C0E; --accent-soft:#361c17;
  --good:#3FCB7E; --good-soft:#153726; --warn:#E0A34A; --warn-soft:#3a2d16; --bad:#F06A5C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#F5F4F2; --surface:#FFFFFF; --surface-2:#ECEBE7; --line:#DEDCD6;
  --ink:#191B1F; --ink-2:#5C5E64; --ink-3:#8A8C91;
  --accent:#E8412A; --accent-ink:#FFFFFF; --accent-soft:#FBE4DF;
  --good:#1F9E5A; --good-soft:#DDF1E6; --warn:#C9852A; --warn-soft:#F6E9D4; --bad:#C4362B;
  --shadow:0 1px 2px rgba(20,22,26,.06), 0 6px 20px rgba(20,22,26,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font);
  -webkit-font-smoothing:antialiased; line-height:1.45;
  font-size:16px; overscroll-behavior-y:none;
}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:16px}
h1,h2,h3,h4{margin:0; text-wrap:balance; letter-spacing:-.02em; font-weight:800}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* App shell */
#app{max-width:560px; margin:0 auto; min-height:100vh; padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px)}
.screen{padding:16px 16px 8px; animation:fade .25s ease}
@keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

.appbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 88%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  padding:14px 16px 10px; display:flex; align-items:flex-end; justify-content:space-between;
  border-bottom:1px solid var(--line)}
.appbar .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
.appbar h1{font-size:26px; line-height:1}
.iconbtn{background:var(--surface); border:1px solid var(--line); color:var(--ink-2);
  width:38px; height:38px; border-radius:11px; display:grid; place-items:center; font-size:17px}

/* Cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; box-shadow:var(--shadow); margin-bottom:14px}
.card.tight{padding:13px}
.label{font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:700; margin-bottom:8px}
.muted{color:var(--ink-2)} .dim{color:var(--ink-3)}
.small{font-size:13px} .xs{font-size:12px}
.row{display:flex; align-items:center; gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex; flex-direction:column; gap:12px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}

/* Buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  padding:12px 16px; border-radius:12px; font-weight:650; font-size:15px; width:100%}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px; width:auto; font-size:14px}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.5}

.chip{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600;
  padding:4px 9px; border-radius:999px; background:var(--surface-2); color:var(--ink-2)}
.chip.accent{background:var(--accent-soft); color:var(--accent)}
.chip.good{background:var(--good-soft); color:var(--good)}
.chip.warn{background:var(--warn-soft); color:var(--warn)}

/* Big readouts */
.readout{font-weight:800; letter-spacing:-.03em; line-height:.95}
.readout.xl{font-size:56px} .readout.lg{font-size:40px}

/* Tab bar */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:color-mix(in srgb,var(--surface) 92%, transparent);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  max-width:560px; margin:0 auto}
.tab{flex:1; background:none; border:0; color:var(--ink-3); display:flex; flex-direction:column;
  align-items:center; gap:3px; padding:7px 2px; border-radius:12px; font-size:10.5px; font-weight:600; letter-spacing:.02em}
.tab svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.9}
.tab.active{color:var(--accent)}
.tab.active svg{stroke:var(--accent)}

/* Forms */
.field{margin-bottom:14px}
.field > label{display:block; font-size:13px; font-weight:650; margin-bottom:6px; color:var(--ink-2)}
.input, select.input, textarea.input{width:100%; background:var(--surface); color:var(--ink);
  border:1px solid var(--line); border-radius:11px; padding:12px 13px; outline:none}
.input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical; min-height:70px}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.opt{border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  padding:10px 12px; border-radius:11px; font-weight:600; font-size:14px; flex:1; min-width:calc(50% - 6px); text-align:left}
.opt small{display:block; font-weight:500; color:var(--ink-3); margin-top:2px; font-size:12px}
.opt.on{border-color:var(--accent); background:var(--accent-soft); color:var(--ink)}
.pill{border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  padding:8px 13px; border-radius:999px; font-weight:600; font-size:13.5px}
.pill.on{border-color:var(--accent); background:var(--accent); color:var(--accent-ink)}
.stepper{display:flex; align-items:center; justify-content:space-between; gap:10px;
  border:1px solid var(--line); border-radius:11px; padding:7px 10px; background:var(--surface)}
.stepper button{width:34px; height:34px; border-radius:9px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink); font-size:19px; font-weight:700}
.stepper .val{font-weight:700; font-variant-numeric:tabular-nums}

/* Progress bar */
.bar{height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden}
.bar > i{display:block; height:100%; background:var(--accent); border-radius:999px}

.divider{height:1px; background:var(--line); margin:14px 0; border:0}
.hairline{height:1px; background:var(--line)}

/* Coach chat */
.bubble{max-width:85%; padding:11px 13px; border-radius:15px; font-size:14.5px; line-height:1.4; white-space:pre-wrap}
.bubble.me{margin-left:auto; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:5px}
.bubble.coach{background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:5px}
.composer{position:sticky; bottom:0; display:flex; gap:8px; padding:10px 0 4px; background:linear-gradient(transparent,var(--bg) 30%)}

/* Set logging table */
.setrow{display:grid; grid-template-columns:26px 1fr 1fr 40px; gap:8px; align-items:center; margin-bottom:8px}
.setrow .n{font-weight:700; color:var(--ink-3); font-variant-numeric:tabular-nums; font-size:14px}
.setrow input{text-align:center; padding:10px 4px}
.setrow .done{width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-3); font-size:17px}
.setrow .done.on{background:var(--good); color:#fff; border-color:transparent}

.sheet-timer{position:sticky; bottom:0; display:flex; align-items:center; gap:12px;
  background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow)}

.toast{position:fixed; left:50%; bottom:calc(var(--tab-h) + 20px); transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:12px; font-size:14px; font-weight:600;
  z-index:60; box-shadow:var(--shadow); max-width:90%; text-align:center; animation:fade .2s}

/* The overlay layer becomes a fixed full-screen sheet whenever it has content,
   sitting above the tab bar (z 30) so nothing is hidden behind the tray. */
#overlay:not(:empty){position:fixed; inset:0; z-index:50; background:var(--bg); overflow-y:auto;
  max-width:560px; margin:0 auto; padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
.thumb{width:78px; height:104px; object-fit:cover; border-radius:9px; border:1px solid var(--line)}
canvas{display:block; width:100%}
a{color:var(--accent)}
.notice{padding:11px 13px; border-radius:12px; font-size:13.5px; display:flex; gap:9px; align-items:flex-start}
.notice.warn{background:var(--warn-soft); color:var(--warn)}
.notice.good{background:var(--good-soft); color:var(--good)}
.notice.accent{background:var(--accent-soft); color:var(--ink)}
</style>

<div id="app"></div>
<div id="tabbar"></div>
<div id="overlay"></div>

<script>
"use strict";
/* ============================ FitCoach web ============================
   Single-file, offline, phone-first. Ports the FitCoach engine logic:
   plan generation (MEV->MAV, RIR, deload), nutrition (Katch-McArdle /
   Mifflin), data sanity checks, EMA trends, rule-based coach, CSV import.
   State persists to localStorage.
===================================================================== */

const $ = (s,r=document)=>r.querySelector(s);
const el = (t,props={},...kids)=>{const n=document.createElement(t);
  for(const k in props){ if(k==="class")n.className=props[k];
    else if(k==="html")n.innerHTML=props[k];
    else if(k.startsWith("on"))n.addEventListener(k.slice(2),props[k]);
    else if(props[k]!=null)n.setAttribute(k,props[k]); }
  for(const kid of kids.flat()){ if(kid!=null) n.append(kid.nodeType?kid:document.createTextNode(kid)); }
  return n;};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const round=(x,step)=>Math.round(x/step)*step;
const uid=()=>Math.random().toString(36).slice(2,10);
const startOfDay=d=>{const x=new Date(d); x.setHours(0,0,0,0); return x.getTime();};
const DAY=86400000;
function toast(msg){ const t=el("div",{class:"toast"},msg); document.body.append(t); setTimeout(()=>t.remove(),2600); }

/* ---------- Persistence ---------- */
const KEY="fitcoach.v1";
let S = load();
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || fresh(); }catch(e){ return fresh(); } }
function fresh(){ return {profile:null, plan:null, nutrition:null, sessions:[], snapshots:[], checkIns:[], chat:[], flags:[], planStart:null, tab:"home"}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Storage full — remove old photos"); } }

/* ---------- Reference data ---------- */
const GOALS={hypertrophy:{label:"Build Muscle",rate:[0.1,0.4]},strength:{label:"Get Stronger",rate:[0,0.4]},
  fatLoss:{label:"Lose Fat",rate:[-1,-0.4]},recomposition:{label:"Recomposition",rate:[-0.25,0.15]}};
const EXP={beginner:{label:"Beginner",scale:0.7,hint:"< 1 year lifting"},
  intermediate:{label:"Intermediate",scale:1.0,hint:"1–4 years"},
  advanced:{label:"Advanced",scale:1.15,hint:"4+ years"}};
const ACTIVITY={sedentary:{label:"Sedentary — desk job",f:1.25},light:{label:"Lightly active",f:1.4},
  moderate:{label:"Moderately active",f:1.55},high:{label:"Very active",f:1.7},athlete:{label:"Extremely active",f:1.85}};
const EQUIP={fullGym:"Full commercial gym",barbellRack:"Barbell + rack (home)",dumbbellsOnly:"Dumbbells only",
  machinesOnly:"Machines only",bandsBodyweight:"Bands / bodyweight"};
const INJURIES={shoulder:"Shoulder",elbow:"Elbow",wrist:"Wrist",lowerBack:"Lower back",hip:"Hip",knee:"Knee",ankle:"Ankle"};
const MUSCLES=["chest","back","shoulders","quads","hamstrings","glutes","biceps","triceps","calves","abs"];
const MLABEL=m=>m.charAt(0).toUpperCase()+m.slice(1);
const LANDMARKS={chest:[8,16,22],back:[10,18,25],shoulders:[8,16,22],quads:[8,14,20],hamstrings:[5,10,16],
  glutes:[4,10,16],biceps:[6,14,20],triceps:[5,12,18],calves:[6,12,16],abs:[4,10,16]};

const LIB=[
 ["barbell-bench-press","Barbell Bench Press","chest",["triceps","shoulders"],["fullGym","barbellRack"],1,1,["shoulder"],"Shoulder blades pinned, bar to lower chest."],
 ["incline-db-press","Incline Dumbbell Press","chest",["shoulders","triceps"],["fullGym","dumbbellsOnly"],1,1,["shoulder"],"30° incline, elbows ~45°."],
 ["machine-chest-press","Machine Chest Press","chest",["triceps"],["fullGym","machinesOnly"],1,2,[],"Full stretch, no shoulder pain."],
 ["cable-fly","Cable Fly","chest",[],["fullGym"],0,2,[],"Slight elbow bend, squeeze mid-line."],
 ["pec-deck","Pec Deck Fly","chest",[],["fullGym","machinesOnly"],0,2,[],"Deep stretch, 2s negative."],
 ["pushup","Push-Up","chest",["triceps","shoulders"],["bandsBodyweight","dumbbellsOnly","fullGym"],1,3,["wrist"],"Body rigid, full range."],
 ["pullup","Pull-Up / Assisted","back",["biceps"],["fullGym","barbellRack","bandsBodyweight"],1,1,["elbow","shoulder"],"Chest to bar, control down."],
 ["lat-pulldown","Lat Pulldown","back",["biceps"],["fullGym","machinesOnly"],1,1,[],"Drive elbows down and in."],
 ["barbell-row","Barbell Row","back",["biceps"],["fullGym","barbellRack"],1,1,["lowerBack"],"Hinge ~45°, pull to lower ribs."],
 ["chest-supported-row","Chest-Supported Row","back",["biceps"],["fullGym","machinesOnly","dumbbellsOnly"],1,1,[],"Chest glued to pad."],
 ["seated-cable-row","Seated Cable Row","back",["biceps"],["fullGym","machinesOnly"],1,2,[],"Squeeze blades, slow release."],
 ["single-arm-db-row","Single-Arm DB Row","back",["biceps"],["fullGym","dumbbellsOnly"],1,2,[],"Row to hip, no rotation."],
 ["overhead-press","Overhead Press","shoulders",["triceps"],["fullGym","barbellRack"],1,1,["shoulder","lowerBack"],"Glutes tight, ribs down."],
 ["seated-db-shoulder-press","Seated DB Shoulder Press","shoulders",["triceps"],["fullGym","dumbbellsOnly"],1,1,["shoulder"],"Elbows slightly forward."],
 ["lateral-raise","DB Lateral Raise","shoulders",[],["fullGym","dumbbellsOnly"],0,1,[],"Lead with elbows, no swing."],
 ["cable-lateral-raise","Cable Lateral Raise","shoulders",[],["fullGym"],0,2,[],"Constant tension, strict."],
 ["reverse-fly","Rear Delt Fly","shoulders",["back"],["fullGym","machinesOnly","dumbbellsOnly"],0,2,[],"High reps, strict."],
 ["barbell-back-squat","Barbell Back Squat","quads",["glutes","hamstrings"],["fullGym","barbellRack"],1,1,["knee","lowerBack","hip"],"Brace hard, controlled depth."],
 ["hack-squat","Hack Squat / Pendulum","quads",["glutes"],["fullGym","machinesOnly"],1,1,["knee"],"Deep, controlled, low-back friendly."],
 ["leg-press","Leg Press","quads",["glutes"],["fullGym","machinesOnly"],1,2,["knee"],"Feet mid-platform, hips down."],
 ["bulgarian-split-squat","Bulgarian Split Squat","quads",["glutes"],["fullGym","dumbbellsOnly","bandsBodyweight"],1,2,["knee"],"Torso forward=glutes, upright=quads."],
 ["leg-extension","Leg Extension","quads",[],["fullGym","machinesOnly"],0,2,["knee"],"Full squeeze, slow negative."],
 ["romanian-deadlift","Romanian Deadlift","hamstrings",["glutes","back"],["fullGym","barbellRack","dumbbellsOnly"],1,1,["lowerBack","hip"],"Hips back, soft knees, stretch."],
 ["seated-leg-curl","Seated Leg Curl","hamstrings",[],["fullGym","machinesOnly"],0,1,[],"Seated beats lying for growth."],
 ["lying-leg-curl","Lying Leg Curl","hamstrings",[],["fullGym","machinesOnly"],0,2,[],"Hips down, no arch."],
 ["hip-thrust","Barbell Hip Thrust","glutes",["hamstrings"],["fullGym","barbellRack"],1,1,["hip"],"Posterior tilt at lockout, chin tucked."],
 ["glute-bridge","DB Glute Bridge","glutes",[],["dumbbellsOnly","bandsBodyweight"],1,3,[],"Pause 1s at top."],
 ["back-extension","45° Back Extension","glutes",["hamstrings","back"],["fullGym","machinesOnly"],1,3,["lowerBack"],"Round-back=glutes."],
 ["db-curl","Dumbbell Curl","biceps",[],["fullGym","dumbbellsOnly"],0,1,["elbow"],"Supinate, no swing."],
 ["incline-db-curl","Incline DB Curl","biceps",[],["fullGym","dumbbellsOnly"],0,2,["elbow"],"Arms hang behind torso."],
 ["cable-curl","Cable EZ Curl","biceps",[],["fullGym"],0,2,["elbow","wrist"],"Constant tension."],
 ["triceps-pushdown","Cable Triceps Pushdown","triceps",[],["fullGym"],0,1,["elbow"],"Elbows pinned, full lockout."],
 ["overhead-triceps-extension","Overhead Triceps Ext","triceps",[],["fullGym","dumbbellsOnly"],0,1,["elbow","shoulder"],"Long-head at long length."],
 ["skull-crusher","EZ Skull Crusher","triceps",[],["fullGym","barbellRack"],0,2,["elbow"],"Bar behind head, elbows steady."],
 ["close-grip-bench","Close-Grip Bench","triceps",["chest"],["fullGym","barbellRack"],1,2,["shoulder","wrist"],"Grip inside shoulder width."],
 ["standing-calf-raise","Standing Calf Raise","calves",[],["fullGym","machinesOnly","dumbbellsOnly","bandsBodyweight"],0,1,["ankle"],"Pause at stretch, full range."],
 ["seated-calf-raise","Seated Calf Raise","calves",[],["fullGym","machinesOnly"],0,2,["ankle"],"Soleus bias, slow tempo."],
 ["cable-crunch","Cable Crunch","abs",[],["fullGym"],0,1,[],"Flex spine, not arms."],
 ["hanging-leg-raise","Hanging Leg Raise","abs",[],["fullGym","barbellRack","bandsBodyweight"],0,1,["shoulder"],"Posterior tilt, no swing."],
 ["weighted-plank","Weighted Plank","abs",[],["bandsBodyweight","dumbbellsOnly","fullGym","machinesOnly"],0,3,[],"30–45s, ribs down."]
].map(a=>({id:a[0],name:a[1],primary:a[2],secondary:a[3],equipment:a[4],compound:!!a[5],tier:a[6],stressed:a[7],cue:a[8]}));
const byID=id=>LIB.find(x=>x.id===id);
function candidates(muscle,equip,injuries){
  return LIB.filter(e=>e.primary===muscle && e.equipment.includes(equip) && e.stressed.every(s=>!injuries.includes(s)))
    .sort((a,b)=> (a.tier-b.tier) || ((a.compound?0:1)-(b.compound?0:1)));
}

/* ---------- Plan engine ---------- */
function splitFor(days){
 const full=["quads","chest","back","hamstrings","shoulders","biceps","triceps","calves","abs"];
 const upA={name:"Upper A",m:["chest","back","shoulders","triceps","biceps"]};
 const upB={name:"Upper B",m:["back","chest","shoulders","biceps","triceps"]};
 const loA={name:"Lower A",m:["quads","hamstrings","glutes","calves","abs"]};
 const loB={name:"Lower B",m:["hamstrings","glutes","quads","calves","abs"]};
 const push={name:"Push",m:["chest","shoulders","triceps"]};
 const pull={name:"Pull",m:["back","biceps","shoulders"]};
 const legs={name:"Legs",m:["quads","hamstrings","glutes","calves","abs"]};
 days=clamp(days,2,6);
 if(days===2)return{name:"Full Body ×2",days:[{name:"Full Body A",m:full},{name:"Full Body B",m:full}]};
 if(days===3)return{name:"Full Body ×3",days:[{name:"Full Body A",m:full},{name:"Full Body B",m:full},{name:"Full Body C",m:full}]};
 if(days===4)return{name:"Upper / Lower",days:[upA,loA,upB,loB]};
 if(days===5)return{name:"Upper / Lower + PPL",days:[upA,loA,push,pull,legs]};
 return{name:"Push / Pull / Legs ×2",days:[push,pull,legs,{name:"Push B",m:push.m},{name:"Pull B",m:pull.m},{name:"Legs B",m:legs.m}]};
}
function repRange(goal,compound){
 if(goal==="strength")return compound?[3,6,210]:[8,12,90];
 if(goal==="fatLoss")return compound?[6,10,120]:[12,15,75];
 return compound?[6,10,150]:[10,15,90];
}
function targetRIR(week,accum){ if(accum<=1)return 2; const p=week/(accum-1); return Math.max(1,3-Math.round(p*2)); }
function estMinutes(day){ let c=0; for(const p of day.exercises) c+=p.sets*(p.rest/60+0.75); return Math.round(8+c); }

function recoveryModifier(){
 const recent=[...S.snapshots].sort((a,b)=>b.date-a.date).slice(0,7);
 if(!recent.length)return 1;
 let pen=0;
 const sl=recent.map(s=>s.sleepHours).filter(v=>v!=null); if(sl.length && avg(sl)<6)pen+=0.1;
 const rc=recent.map(s=>s.recoveryScore).filter(v=>v!=null); if(rc.length && avg(rc)<50)pen+=0.1;
 const hrv=S.snapshots.map(s=>s.hrvMs).filter(v=>v!=null);
 if(hrv.length>=14){ const r=avg(hrv.slice(-7)), b=avg(hrv); if(r<b*0.75)pen+=0.1; }
 return Math.max(0.8,1-pen);
}
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;

function generatePlan(profile){
 const modifier=recoveryModifier();
 const mesoWeeks=5, accum=4;
 const sp=splitFor(profile.daysPerWeek);
 const scale=EXP[profile.experience].scale*modifier;
 const weeks=[];
 for(let w=0; w<mesoWeeks; w++){
  const isDeload=w===mesoWeeks-1;
  const rir=isDeload?4:targetRIR(w,accum);
  const prog=isDeload?0:w/Math.max(accum-1,1);
  const targets={};
  for(const m of MUSCLES){
   const [mev,mav,mrv]=LANDMARKS[m].map(v=>v*scale);
   let t=mev+(mav-mev)*prog;
   if(profile.priority.includes(m))t=Math.min(t+3,mrv);
   if(isDeload)t=mev*0.6;
   targets[m]=Math.max(0,Math.round(t));
  }
  weeks.push({index:w,isDeload,targetRIR:rir,days:buildDays(sp.days,targets,profile,rir)});
 }
 return {id:uid(),createdAt:Date.now(),goal:profile.goal,mesoWeeks,weeks,splitName:sp.name,
   rationale:rationale(profile,sp.name,modifier),revisions:(S.plan&&S.plan.revisions)||[]};
}
function buildDays(templates,weeklyTargets,profile,rir){
 const freq={}; templates.forEach(t=>t.m.forEach(m=>freq[m]=(freq[m]||0)+1));
 const remaining={...weeklyTargets};
 const days=[];
 templates.forEach((tpl,dayIdx)=>{
  const ex=[];
  for(const m of tpl.m){
   const f=Math.max(freq[m]||1,1), weekly=weeklyTargets[m]||0;
   if(weekly<=0)continue;
   const base=Math.floor(weekly/f);
   const left=templates.slice(dayIdx).filter(t=>t.m.includes(m)).length;
   const extra=(remaining[m]||0)-base*left;
   let today=Math.min(remaining[m]||0, Math.max(base+Math.max(extra,0),0));
   today=Math.min(today,8);
   if(today<2)continue;
   remaining[m]-=today;
   const pool=candidates(m,profile.equipment,profile.injuries);
   if(!pool.length)continue;
   const offset=templates.slice(0,dayIdx).filter(t=>t.m.includes(m)).length;
   let slot=0;
   while(today>0 && slot<3){
    const e=pool[(offset+slot)%pool.length];
    const chunk=Math.min(today, e.compound?4:3);
    const [lo,hi,rest]=repRange(profile.goal,e.compound);
    ex.push({id:uid(),exerciseID:e.id,name:e.name,sets:chunk,lo,hi,rir,rest,note:e.cue});
    today-=chunk; slot++;
   }
  }
  const day={id:uid(),name:tpl.name,focus:tpl.m,exercises:ex};
  trimToBudget(day,profile.minutesPerSession,profile.priority);
  days.push(day);
 });
 return days;
}
function trimToBudget(day,minutes,priority){
 let g=0;
 while(estMinutes(day)>minutes && g<60){ g++;
  let idx=-1;
  for(let i=day.exercises.length-1;i>=0;i--){ const e=byID(day.exercises[i].exerciseID);
   if(e && !e.compound && !priority.includes(e.primary)){ idx=i; break; } }
  if(idx<0)idx=day.exercises.length-1;
  if(idx<0)return;
  if(day.exercises[idx].sets>2)day.exercises[idx].sets--;
  else if(day.exercises.length>3)day.exercises.splice(idx,1);
  else{ let j=0; for(let i=1;i<day.exercises.length;i++)if(day.exercises[i].sets>day.exercises[j].sets)j=i;
   if(day.exercises[j].sets>2)day.exercises[j].sets--; else return; }
 }
}
function rationale(p,split,mod){
 const L=[];
 L.push(`Split: ${split} — chosen for ${p.daysPerWeek} days/week so each muscle is trained ~2× weekly, which meta-analyses (Schoenfeld 2016) show beats 1× at equal volume.`);
 L.push("Volume: each muscle starts near its minimum effective volume (MEV) and ramps toward maximum adaptive volume (MAV) over 4 weeks, capped at MRV — the Renaissance Periodization landmark model.");
 L.push("Effort: sets are prescribed by reps-in-reserve (RIR 3 → 1 across the block). Training close to failure drives growth without the recovery cost of constant failure.");
 L.push("Progression: double progression — add reps within the range first, then ~2.5% load. The app suggests loads from your last logged session.");
 L.push("Week 5 is a deload (~60% volume, RIR 4, lighter loads) to shed fatigue before the next mesocycle.");
 if(p.priority.length)L.push(`Priority: extra weekly sets biased toward ${p.priority.map(MLABEL).join(", ")}.`);
 if(p.injuries.length)L.push(`Movements loading your ${p.injuries.map(i=>INJURIES[i].toLowerCase()).join(", ")} were excluded and swapped for joint-friendly variants.`);
 if(mod<1)L.push(`Volume trimmed ${Math.round((1-mod)*100)}% because recent sleep/HRV suggests compromised recovery.`);
 L.push(`Sessions are auto-fitted to your ${p.minutesPerSession}-minute budget by trimming accessory volume first — compounds are protected.`);
 return L.join("\n\n");
}
function suggestion(prescription){
 const logs=[...S.sessions].sort((a,b)=>b.date-a.date).flatMap(s=>s.logs).filter(l=>l.exerciseID===prescription.exerciseID);
 if(!logs.length)return null;
 const recentDay=startOfDay(logs[0].completedAt);
 const last=logs.filter(l=>startOfDay(l.completedAt)===recentDay);
 let top=last[0]; for(const l of last)if(e1rm(l)>e1rm(top))top=l;
 if(last.every(l=>l.reps>=prescription.hi)){
  const inc=Math.max(top.weightKg*0.025,1);
  return {weightKg:round(top.weightKg+inc,2.5),reps:prescription.lo};
 }
 return {weightKg:top.weightKg,reps:Math.min(top.reps+1,prescription.hi)};
}
const e1rm=l=>l.weightKg*(1+l.reps/30);

/* ---------- Nutrition engine ---------- */
function computeNutrition(profile){
 const w=trendWeight()||profile.weight;
 const bf=trendBodyFat()||profile.bodyFat;
 let bmr,method;
 if(bf && bf>3 && bf<60){ const lean=w*(1-bf/100); bmr=370+21.6*lean; method=`Katch-McArdle (lean ${lean.toFixed(1)} kg)`; }
 else{ const s=profile.sex==="male"?5:-161; bmr=10*w+6.25*profile.height-5*profile.age+s; method="Mifflin-St Jeor"; }
 const trainKcal=profile.daysPerWeek*profile.minutesPerSession*7.5;
 const tdee=bmr*ACTIVITY[profile.activity].f + trainKcal/7;
 let cal,note;
 if(profile.goal==="fatLoss"){cal=Math.max(tdee*0.8,bmr*1.05); note="20% deficit — targets ~0.5–0.75% BW/week lost while sparing muscle.";}
 else if(profile.goal==="hypertrophy"){cal=tdee*1.10; note="10% surplus — supports growth (~0.25% BW/week) without excess fat.";}
 else if(profile.goal==="strength"){cal=tdee*1.05; note="Slight surplus for performance & recovery.";}
 else{cal=tdee*0.97; note="~Maintenance — recomposition runs on high protein + progressive training.";}
 let protein=w*(profile.goal==="fatLoss"?2.2:1.8);
 if(bf && bf>30)protein=w*(1-bf/100)*2.6;
 const fat=Math.max(w*0.8, cal*0.2/9);
 const carbs=Math.max((cal-protein*4-fat*9)/4,0);
 const rationale=`${note}\n\nProtein ${Math.round(protein)} g (${(protein/w).toFixed(1)} g/kg): the 1.6–2.2 g/kg range maximises muscle protein synthesis (Morton 2018); dieting pushes to the top.\n\nFat ${Math.round(fat)} g: ≥0.8 g/kg and ≥20% of calories for hormonal health.\n\nCarbs ${Math.round(carbs)} g: the remainder — fuels training & recovery. Bias them around workouts.\n\nAnchored to your trend weight, not single weigh-ins. Weekly check-ins nudge calories ±100–200 kcal if your rate drifts off target.`;
 return {calories:Math.round(cal),protein:Math.round(protein),carbs:Math.round(carbs),fat:Math.round(fat),
   bmr:Math.round(bmr),tdee:Math.round(tdee),method,rationale,updatedAt:Date.now()};
}
function supplements(p){

  ["Caffeine",`${Math.round(p.weight*2)}–${Math.round(p.weight*3)} mg (2–3 mg/kg)`,"30–45 min pre-workout. Cut off 8+ h before bed.","Well-established ergogenic for strength & volume."],
  ["Whey / Casein","As needed to hit protein","Post-workout or between meals; casein pre-sleep.","Food first — powder is convenient protein."],
  ["Vitamin D3","1000–2000 IU","With a fatty meal.","Worth it with limited sun; supports bone & hormones."],

/* ---------- Data sanity + trends ---------- */
function runSanity(){
 const flags=[]; const sorted=[...S.snapshots].sort((a,b)=>a.date-b.date);
 const push=(date,metric,sev,msg)=>flags.push({id:uid(),date,metric,severity:sev,message:msg});
 for(const s of sorted){
  if(s.weightKg!=null && (s.weightKg<30||s.weightKg>300))push(s.date,"weight","suspect",`Weight ${s.weightKg.toFixed(1)} kg is out of range — ignored in trends. Check unit (lb vs kg?) in ${s.source}.`);
  if(s.bodyFatPercent!=null && (s.bodyFatPercent<3||s.bodyFatPercent>60))push(s.date,"bodyFat","suspect",`Body fat ${s.bodyFatPercent.toFixed(1)}% is implausible — BIA scales misfire. Ignored.`);
  if(s.sleepHours && (s.sleepHours<2.5||s.sleepHours>14))push(s.date,"sleep","caution",`Sleep of ${s.sleepHours.toFixed(1)} h looks off — partial or duplicated recording.`);
  if(s.caloriesIn && s.caloriesIn<800)push(s.date,"calories","caution",`Only ${Math.round(s.caloriesIn)} kcal logged on ${fdate(s.date)} — likely incomplete logging. Take MFP averages with a pinch of salt.`);
  if(s.proteinG && s.caloriesIn && s.proteinG*4>s.caloriesIn)push(s.date,"macros","suspect",`Logged protein exceeds total calories on ${fdate(s.date)} — macro entries inconsistent.`);
 }
 const W=sorted.filter(s=>s.weightKg!=null).map(s=>[s.date,s.weightKg]);
 for(let i=1;i<W.length;i++){ const gap=Math.max(Math.round((W[i][0]-W[i-1][0])/DAY),1);
  const pct=Math.abs(W[i][1]-W[i-1][1])/W[i-1][1]*100/gap;
  if(pct>1.5)push(W[i][0],"weight","caution",`Weight jumped ${(W[i][1]-W[i-1][1]).toFixed(1)} kg in ${gap} day(s) — almost certainly water/glycogen, not tissue. Trend uses the smoothed line.`);
 }
 S.flags=flags;
}
function fdate(t){return new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"});}
function weightTrend(){
 const suspect=new Set(S.flags.filter(f=>f.metric==="weight"&&f.severity==="suspect").map(f=>startOfDay(f.date)));
 const pts=S.snapshots.filter(s=>s.weightKg!=null).map(s=>[startOfDay(s.date),s.weightKg])
   .filter(p=>!suspect.has(p[0])).sort((a,b)=>a[0]-b[0]);
 if(!pts.length)return [];
 let ema=pts[0][1]; const alpha=2/8;
 return pts.map(([d,w])=>{ ema=alpha*w+(1-alpha)*ema; return {date:d,value:ema}; });
}
function trendWeight(){ const t=weightTrend(); return t.length?t[t.length-1].value:null; }
function trendBodyFat(){ const v=S.snapshots.filter(s=>s.bodyFatPercent!=null&&s.bodyFatPercent>3&&s.bodyFatPercent<60)
   .sort((a,b)=>a.date-b.date).slice(-7).map(s=>s.bodyFatPercent); return v.length?avg(v):null; }
function weeklyRate(trend){ if(trend.length<2)return null; const last=trend[trend.length-1];
 let ref=null; for(let i=trend.length-1;i>=0;i--)if(last.date-trend[i].date>=12*DAY){ref=trend[i];break;}
 if(!ref)return null; const days=(last.date-ref.date)/DAY; return (last.value-ref.value)/days*7; }
function strengthTrend(exID){ const byDay={};
 for(const s of S.sessions)for(const l of s.logs)if(l.exerciseID===exID){ const d=startOfDay(l.completedAt);
   byDay[d]=Math.max(byDay[d]||0,e1rm(l)); }
 return Object.entries(byDay).map(([d,v])=>({date:+d,value:v})).sort((a,b)=>a.date-b.date); }

/* ---------- CSV / JSON import ---------- */
function splitCSVLine(line){ const out=[]; let cur="",q=false;
 for(const ch of line){ if(ch==='"'){q=!q;continue;} if(ch===','&&!q){out.push(cur);cur="";continue;} cur+=ch; } out.push(cur); return out; }
function parseDate(raw){ const s=raw.trim().replace(/"/g,""); let d=new Date(s); if(!isNaN(d))return d.getTime();
 const m=s.match(/(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{1,4})/); if(m){ d=new Date(s); if(!isNaN(d))return d.getTime(); } return null; }
function importCSV(text,source){
 const lines=text.split(/\r?\n/).filter(l=>l.trim()); if(lines.length<2)throw new Error("No data rows.");
 const header=splitCSVLine(lines[0]).map(h=>h.trim().toLowerCase());
 const col=(...c)=>{ for(const x of c){const i=header.indexOf(x); if(i>=0)return i;} for(const x of c){const i=header.findIndex(h=>h.includes(x)); if(i>=0)return i;} return -1; };
 const cDate=col("date","day","timestamp","time");
 if(cDate<0)throw new Error("No date column found. Export the raw CSV and retry.");
 const cW=col("weight (kg)","weight"),cFM=col("fat mass (kg)"),cBF=col("fat (%)","body fat","fat_ratio"),
  cCal=col("calories","energy (kcal)","kcal_in","energy"),cP=col("protein (g)","protein"),
  cC=col("carbohydrates (g)","carbs (g)","carbohydrates","carbs"),cF=col("fat (g)"),
  cHRV=col("hrv","heart rate variability","night hrv"),cRHR=col("resting heart rate","rhr","lowest heart rate"),
  cSleep=col("sleep duration","total sleep","time asleep","sleep (h)","sleep hours"),
  cRec=col("recovery","readiness","recovery score"),cStep=col("steps","step count");
 if([cW,cFM,cBF,cCal,cP,cC,cF,cHRV,cRHR,cSleep,cRec,cStep].every(i=>i<0))throw new Error("No recognisable metric columns.");
 const byDay={};
 for(const line of lines.slice(1)){ const f=splitCSVLine(line); if(f.length<=cDate)continue;
  const dt=parseDate(f[cDate]); if(dt==null)continue; const day=startOfDay(dt);
  const v=i=>{ if(i<0||f.length<=i)return null; const n=parseFloat(f[i].replace(/[",]/g,"")); return isNaN(n)?null:n; };
  const s=byDay[day]||{id:uid(),date:day,source};
  if(v(cW)!=null)s.weightKg=v(cW);
  if(v(cFM)!=null&&s.weightKg)s.bodyFatPercent=v(cFM)/s.weightKg*100;
  if(v(cBF)!=null)s.bodyFatPercent=v(cBF);
  if(v(cCal)!=null)s.caloriesIn=(s.caloriesIn||0)+v(cCal);
  if(v(cP)!=null)s.proteinG=(s.proteinG||0)+v(cP);
  if(v(cC)!=null)s.carbsG=(s.carbsG||0)+v(cC);
  if(v(cF)!=null)s.fatG=(s.fatG||0)+v(cF);
  if(v(cHRV)!=null)s.hrvMs=v(cHRV);
  if(v(cRHR)!=null)s.restingHeartRate=v(cRHR);
  if(v(cSleep)!=null)s.sleepHours=v(cSleep)>20?v(cSleep)/60:v(cSleep);
  if(v(cRec)!=null)s.recoveryScore=v(cRec);
  if(v(cStep)!=null)s.steps=v(cStep);
  byDay[day]=s;
 }
 const rows=Object.values(byDay); if(!rows.length)throw new Error("No parseable rows.");
 return rows;
}
function ingest(rows){
 let added=0,merged=0;
 for(const r of rows){ const i=S.snapshots.findIndex(s=>startOfDay(s.date)===startOfDay(r.date));
  if(i>=0){ S.snapshots[i]={...S.snapshots[i],...Object.fromEntries(Object.entries(r).filter(([k,v])=>v!=null))}; merged++; }
  else{ S.snapshots.push(r); added++; } }

/* ---------- Canvas line chart ---------- */
function drawLine(canvas,data,showPoints){
 if(!canvas)return; const dpr=window.devicePixelRatio||1;

 const L=8,R=8,T=10,B=20;
 const px=x=>L+(x-minX)/((maxX-minX)||1)*(W-L-R);
 const py=y=>T+(1-(y-minY)/((maxY-minY)||1))*(H-T-B);
 ctx.strokeStyle=line; ctx.lineWidth=1;
 for(let i=0;i<=2;i++){ const y=T+i/2*(H-T-B); ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(W-R,y); ctx.stroke(); }
 // area
 const grad=ctx.createLinearGradient(0,T,0,H-B); grad.addColorStop(0,accent+"33"); grad.addColorStop(1,accent+"00");
 ctx.beginPath(); ctx.moveTo(px(xs[0]),py(ys[0]));
 for(let i=1;i<data.length;i++)ctx.lineTo(px(xs[i]),py(ys[i]));
 ctx.lineTo(px(xs[xs.length-1]),H-B); ctx.lineTo(px(xs[0]),H-B); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
 // line
 ctx.beginPath(); ctx.moveTo(px(xs[0]),py(ys[0]));
 for(let i=1;i<data.length;i++)ctx.lineTo(px(xs[i]),py(ys[i]));
 ctx.strokeStyle=accent; ctx.lineWidth=2.5; ctx.lineJoin="round"; ctx.stroke();
 // endpoint
 const lx=px(xs[xs.length-1]),ly=py(ys[ys.length-1]);
 ctx.fillStyle=accent; ctx.beginPath(); ctx.arc(lx,ly,4,0,7); ctx.fill();
 ctx.fillStyle=cs.getPropertyValue("--surface").trim(); ctx.beginPath(); ctx.arc(lx,ly,1.6,0,7); ctx.fill();
 if(showPoints){ ctx.fillStyle=accent; for(let i=0;i<data.length;i++){ ctx.beginPath(); ctx.arc(px(xs[i]),py(ys[i]),3,0,7); ctx.fill(); } }
 // labels
 ctx.fillStyle=ink3; ctx.font="11px "+cs.getPropertyValue("--font"); ctx.textBaseline="top";
 ctx.fillText(fdate(minX),L,H-B+5);
 ctx.textAlign="right"; ctx.fillText(fdate(maxX),W-R,H-B+5); ctx.textAlign="left";

}
